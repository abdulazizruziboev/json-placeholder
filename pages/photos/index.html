<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Placeholder - Photos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    
    <header class="flex justify-center items-center min-h-[60px] bg-white border-b border-b-[#0003] z-50">

        <div class="flex justify-between items-center w-full max-w-[1312px] px-4">

            <a href="/">
                JSONPlaceholder
            </a>

            <nav class="header-navbar flex hidden fixed top-[60px] left-0 bg-white border-b border-b-[#0003] w-full p-4 md:flex md:static md:border-b-0 md:w-auto z-50">
                <ul class="flex flex-col gap-4  md:flex-row">
                    <li>
                        <a class="hover:underline" href="/">Posts</a>
                    </li>
                    <li>
                        <a class="hover:underline" href="/pages/comments">Comments</a>
                    </li>
                    <li>
                        <a class="hover:underline" href="/pages/albums">Albums</a>
                    </li>
                    <li>
                        <a class="underline" href="/pages/photos">Photos</a>
                    </li>
                    <li>
                        <a class="hover:underline" href="/pages/todos">Todos</a>
                    </li>
                    <li>
                        <a class="hover:underline" href="/pages/users">Users</a>
                    </li>
                </ul>
            </nav>

            <button class="cursor-pointer header-navbar-toggler md:hidden">

                <svg class="size-5" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 3C1.22386 3 1 3.22386 1 3.5C1 3.77614 1.22386 4 1.5 4H13.5C13.7761 4 14 3.77614 14 3.5C14 3.22386 13.7761 3 13.5 3H1.5ZM1 7.5C1 7.22386 1.22386 7 1.5 7H13.5C13.7761 7 14 7.22386 14 7.5C14 7.77614 13.7761 8 13.5 8H1.5C1.22386 8 1 7.77614 1 7.5ZM1 11.5C1 11.2239 1.22386 11 1.5 11H13.5C13.7761 11 14 11.2239 14 11.5C14 11.7761 13.7761 12 13.5 12H1.5C1.22386 12 1 11.7761 1 11.5Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>

            </button>

        </div>

    </header>

    <main class="w-full min-h-[calc(100vh-60px)]">
        <section class="w-full">
        
            <div class="max-w-[1312px] p-4 mx-auto">
            
                <div class="photos-loading text-black flex items-center justify-center w-full min-h-[calc(100vh-95px)]">
                    <svg width="60" height="60" viewBox="0 0 44 44" stroke="currentColor"><circle cx="22" cy="22" r="6" fill="none" stroke-width="2"><animate attributeName="r" from="6" to="20" dur="1.5s" begin="0s" repeatCount="indefinite"></animate><animate attributeName="opacity" from="1" to="0" dur="1.5s" begin="0s" repeatCount="indefinite"></animate></circle><circle cx="22" cy="22" r="6" fill="none" stroke-width="2"><animate attributeName="r" from="6" to="20" dur="1.5s" begin="0.5s" repeatCount="indefinite"></animate><animate attributeName="opacity" from="1" to="0" dur="1.5s" begin="0.5s" repeatCount="indefinite"></animate></circle></svg>
                </div>

                <div class="photos-wrapper-box hidden  grid gap-4 md:grid-cols-2"></div>

                <button class="show-more-results-button hidden  flex justify-center items-center mt-4 w-full gap-2 cursor-pointer bg-white border border-[#0003] p-2">
                    <span>Show more </span>
                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.85355 2.14645C3.65829 1.95118 3.34171 1.95118 3.14645 2.14645C2.95118 2.34171 2.95118 2.65829 3.14645 2.85355L7.14645 6.85355C7.34171 7.04882 7.65829 7.04882 7.85355 6.85355L11.8536 2.85355C12.0488 2.65829 12.0488 2.34171 11.8536 2.14645C11.6583 1.95118 11.3417 1.95118 11.1464 2.14645L7.5 5.79289L3.85355 2.14645ZM3.85355 8.14645C3.65829 7.95118 3.34171 7.95118 3.14645 8.14645C2.95118 8.34171 2.95118 8.65829 3.14645 8.85355L7.14645 12.8536C7.34171 13.0488 7.65829 13.0488 7.85355 12.8536L11.8536 8.85355C12.0488 8.65829 12.0488 8.34171 11.8536 8.14645C11.6583 7.95118 11.3417 7.95118 11.1464 8.14645L7.5 11.7929L3.85355 8.14645Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>

                <div class="results-not-available-box hidden text-black flex flex-col items-center justify-center w-full min-h-[calc(100vh-95px)]">
                    <svg class="size-25 opacity-50" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 2C3.22386 2 3 2.22386 3 2.5V12.5C3 12.7761 3.22386 13 3.5 13H11.5C11.7761 13 12 12.7761 12 12.5V6H8.5C8.22386 6 8 5.77614 8 5.5V2H3.5ZM9 2.70711L11.2929 5H9V2.70711ZM2 2.5C2 1.67157 2.67157 1 3.5 1H8.5C8.63261 1 8.75979 1.05268 8.85355 1.14645L12.8536 5.14645C12.9473 5.24021 13 5.36739 13 5.5V12.5C13 13.3284 12.3284 14 11.5 14H3.5C2.67157 14 2 13.3284 2 12.5V2.5Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    <span class="opacity-40">
                        Photos not available
                    </span>
                </div>

                <div class="something-wrong-box hidden text-black flex flex-col items-center justify-center w-full min-h-[calc(100vh-95px)]">
                    <svg class="size-25 opacity-50" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.4449 0.608765C8.0183 -0.107015 6.9817 -0.107015 6.55509 0.608766L0.161178 11.3368C-0.275824 12.07 0.252503 13 1.10608 13H13.8939C14.7475 13 15.2758 12.07 14.8388 11.3368L8.4449 0.608765ZM7.4141 1.12073C7.45288 1.05566 7.54712 1.05566 7.5859 1.12073L13.9798 11.8488C14.0196 11.9154 13.9715 12 13.8939 12H1.10608C1.02849 12 0.980454 11.9154 1.02018 11.8488L7.4141 1.12073ZM6.8269 4.48611C6.81221 4.10423 7.11783 3.78663 7.5 3.78663C7.88217 3.78663 8.18778 4.10423 8.1731 4.48612L8.01921 8.48701C8.00848 8.766 7.7792 8.98664 7.5 8.98664C7.2208 8.98664 6.99151 8.766 6.98078 8.48701L6.8269 4.48611ZM8.24989 10.476C8.24989 10.8902 7.9141 11.226 7.49989 11.226C7.08567 11.226 6.74989 10.8902 6.74989 10.476C6.74989 10.0618 7.08567 9.72599 7.49989 9.72599C7.9141 9.72599 8.24989 10.0618 8.24989 10.476Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    <span class="opacity-40 text-center">
                        Something wrong... <br> Try again later :)
                    </span>
                </div>

            </div>

        </section>

    </main>
    
    <template id="photo-card-template">
        <article class="photo-card bg-white border border-[#0003] p-4 ">
            <img src="" alt="" class="photo-image w-full h-[250px] mb-3 object-cover"/>
            <h2 class="photo-title text-[20px] font-[550] leading-[120%]">
                sunt aut facere repellat provident occaecati excepturi optio reprehenderit
            </h2>
        </article>
    </template>

    <script src="/js/photos/index.js" type="module" defer></script>
    <script  src="/js/components/header-navbar.mjs" type="module" defer></script>
</body>
</html>
